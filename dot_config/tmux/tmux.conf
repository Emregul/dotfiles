# Set the prefix to Ctrl+a
set -g prefix C-a

# Remove the old prefix
unbind C-b

# Send Ctrl+a to applications by pressing it twice
bind C-a send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

set-option -g default-shell /opt/homebrew/bin/fish

# True color + undercurl support (wavy diagnostic underlines in neovim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Faster escape time (important for neovim)
set -sg escape-time 0

# Focus events (for vim autoread)
set -g focus-events on

# Stay in tmux when a session is destroyed (switch to another)
set -g detach-on-destroy off

# Resize to smallest *active* client, not smallest overall
setw -g aggressive-resize on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# panes: window splitting (open in current directory)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle maximize pane
bind -r m resize-pane -Z

# Vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Session management
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind s choose-tree -sZ

# Reorder windows with no prefix needed
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Popup: session switcher (fzf over active sessions)
bind C-j display-popup -h 40% -w 40% -E "~/.config/tmux/scripts/tmux-session-switcher"

# Popup: zoxide project opener (jump to recent dir as new session)
bind C-t display-popup -h 50% -w 60% -E "~/.config/tmux/scripts/tmux-zoxide-opener"

# Mouse mode
set -g mouse on

# Scrollback history
set -g history-limit 50000

# OSC52 clipboard (allows copy from within tmux/ssh)
set -g set-clipboard on
set -g allow-passthrough on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Plugin to save and restore tmux sessions after restart
# * Save with: prefix + Ctrl-s
# * Restore with: prefix + Ctlr-r

set -g @plugin 'tmux-plugins/tmux-resurrect'
# restore vim and nvim sessions as well
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
  # Automatic restore
set -g @continuum-restore 'on'

# Make navigation between tmux and vim panes seamlessly (smart-splits handles both sides)
set -g @plugin 'mrjones2014/smart-splits.nvim'

# Quick-copy: hint-based (prefix + F) and fzf-based (prefix + e)
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'e'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Run Tmux Plugin Manager
run '~/.config/tmux/plugins/tpm/tpm'

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
